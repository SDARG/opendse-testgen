dependencies {
	//opt4j
	implementation 'com.github.SDARG.opt4j:opt4j-core:v3.4.0'
	implementation 'com.github.SDARG.opt4j:opt4j-satdecoding:v3.4.0'
	implementation 'com.github.SDARG.opt4j:opt4j-viewer:v3.4.0'
	implementation 'com.github.SDARG.opt4j:opt4j-operators:v3.4.0'
	
	//opendse
	implementation 'com.github.sdarg.opendse:opendse-generator:v1.0.0'
	implementation 'com.github.sdarg.opendse:opendse-io:v1.0.0'
	implementation 'com.github.sdarg.opendse:opendse-model:v1.0.0'
	implementation 'com.github.sdarg.opendse:opendse-optimization:v1.0.0'
	implementation 'com.github.sdarg.opendse:opendse-realtime:v1.0.0'
	implementation 'com.github.sdarg.opendse:opendse-visualization:v1.0.0'
	
	//jreliability
	implementation 'com.github.sdarg:jreliability:v3.0'
	
	
	implementation group: 'net.sourceforge.collections', name: 'collections-generic', version: '4.01'
	
	//junit/mockito for testing
	testImplementation platform(group: 'org.junit', name: 'junit-bom', version: project.junitVersion)
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter'
	testImplementation group: 'org.junit.platform', name: 'junit-platform-launcher'
	testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: project.mockitoVersion
}
